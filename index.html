<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Pro Platform</title>
    <!-- Socket.io CDN -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- LiveKit Client SDK CDN (Birinchi yuklanishi shart) -->
    <script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.js"></script>
    <!-- Bizning asosiy JavaScript faylimiz -->
    <script src="app.js" defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #lobby {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #1c1c1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
        }
        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3a3a3c;
            background: #2c2c2e;
            color: white;
            font-size: 16px;
        }
        button {
            background: #0a84ff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #007aff; }
        #meet-container {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
        }
        #video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #000;
            overflow-y: auto;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            background: #2c2c2e;
            transform: scaleX(-1);
        }
        #controls {
            height: 80px;
            background: #1c1c1e;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .control-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2c2c2e;
            border: none;
            cursor: pointer;
        }
        .control-btn:hover { background: #3a3a3c; }
        .leave-btn {
            background: #ff453a;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .leave-btn:hover { background: #ff3b30; }
        .zoom-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .zoom-modal {
            background: #1c1c1e;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            width: 300px;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .accept-btn { background: #30d158; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .reject-btn { background: #ff453a; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Kirish qismi -->
    <div id="lobby">
        <h2 style="text-align: center; margin-top: 0;">Uchrashuvga qo'shilish</h2>
        <input type="text" id="username" placeholder="Ismingizni kiriting..." required>
        <input type="text" id="room-id" placeholder="Xona ID (masalan: room123)" required>
        <select id="role">
            <option value="guest">Mehmon (Guest)</option>
            <option value="admin">Admin</option>
        </select>
        <button id="join-btn">Kirish</button>
    </div>

    <!-- Video chat qismi -->
    <div id="meet-container">
        <div id="video-grid"></div>
        <div id="controls">
            <button class="control-btn" id="toggle-mic">🎙️</button>
            <button class="control-btn" id="toggle-cam">📹</button>
            <button class="leave-btn" id="leave-btn">❌ Chiqish</button>
        </div>
    </div>

    <!-- Admin uchun so'rovnoma Modal oynasi -->
    <div id="admin-modal" class="zoom-modal-overlay" style="display: none;">
        <div class="zoom-modal">
            <p id="modal-text">Foydalanuvchi kirishni so'ramoqda...</p>
            <div class="modal-buttons">
                <button class="accept-btn" id="btn-accept">Ruxsat berish</button>
                <button class="reject-btn" id="btn-reject">Rad etish</button>
            </div>
        </div>
    </div>

    <!-- Mehmon uchun kutish oynasi -->
    <div id="guest-modal" class="zoom-modal-overlay" style="display: none;">
        <div class="zoom-modal">
            <h3 style="margin-0">Kutish zali</h3>
            <p style="color: #8e8e93;">Admin ruxsat berishini kuting...</p>
            <div style="margin-top: 15px;" class="spinner">⏳</div>
        </div>
    </div>

</body>
</html>
