<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Professional Platforma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0b0d;
            --panel-bg: rgba(20, 20, 24, 0.95);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f5f5f7;
            --accent-green: #30d158;
            --danger-red: #ff453a;
            --btn-hover: #2c2c2e;
            --chat-bg: #1c1c1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent; /* Mobil teginish izini o'chirish */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: -webkit-fill-available; /* IOS safari uchun to'liq ekran mosligi */
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Yuqori ma'lumotlar paneli */
        .header-bar {
            height: 50px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .room-info {
            font-size: 13px;
            font-weight: 500;
            background: rgba(28, 28, 30, 0.8);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .room-id-badge {
            color: var(--accent-green);
            font-weight: 700;
        }

        /* Asosiy ishchi maydon */
        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            height: calc(100vh - 80px);
            margin-top: 50px;
        }

        /* Dinamik Video Grid (Zoom ko'rinishi) */
        .video-grid-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        #video-grid {
            display: grid;
            gap: 8px;
            width: 100%;
            height: 100%;
            max-width: 1400px;
            justify-content: center;
            align-content: center;
            transition: all 0.3s ease;
        }

        /* Video Box */
        .video-box {
            position: relative;
            background-color: #1c1c1e;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
            width: 100%;
            height: 100%;
        }

        /* Telefonda video vertikal (tikka) holatda chiroyli chiqishi uchun */
        @media (max-width: 480px) {
            .video-box {
                aspect-ratio: 3 / 4; /* Mobil ekran uchun juda qulay nisbat */
            }
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Videolar chetida qora bo'shliqlar qolmaydi */
            transform: scaleX(-1);
        }

        .video-overlay {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.65);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(5px);
            max-width: calc(100% - 16px);
        }

        .video-overlay span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-icon {
            font-size: 10px;
        }

        .status-icon.muted {
            color: var(--danger-red);
        }

        /* O'ng tomondan chiquvchi Chat paneli (Slayder-Parda effektida) */
        .chat-sidebar {
            width: 350px;
            background-color: var(--chat-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), width 0.3s ease;
            position: relative;
            z-index: 20;
        }

        .chat-sidebar.closed {
            width: 0;
            transform: translateX(100%);
        }

        .chat-header {
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-chat-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 18px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-chat-btn:hover {
            background-color: var(--btn-hover);
        }

        #chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            align-self: flex-start;
            font-size: 13px;
            word-break: break-word;
        }

        .chat-msg.me {
            background: rgba(48, 209, 88, 0.15);
            border-left: 3px solid var(--accent-green);
            align-self: flex-end;
        }

        .msg-meta {
            font-size: 9px;
            opacity: 0.5;
            margin-bottom: 3px;
            font-weight: bold;
        }

        .chat-input-area {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            background-color: var(--chat-bg);
        }

        .chat-input-area input {
            flex: 1;
            background-color: #2c2c2e;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 16px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-green);
        }

        .send-btn {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Pastki boshqaruv paneli */
        .control-bar {
            height: 80px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 15;
            backdrop-filter: blur(20px);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            min-width: 65px;
            height: 60px;
            transition: background-color 0.2s;
        }

        .control-btn:hover {
            background-color: var(--btn-hover);
        }

        .control-btn i {
            font-size: 18px;
        }

        .control-btn span {
            font-size: 10px;
            font-weight: 500;
            white-space: nowrap;
        }

        .control-btn.off i {
            color: var(--danger-red);
        }

        .leave-btn {
            background-color: var(--danger-red);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .leave-btn:hover {
            opacity: 0.9;
        }

        /* Kirish oynasi (Modal) */
        .join-panel-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }
