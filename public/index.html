<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Mini-Platforma (To'liq Versiya)</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #141414; color: white; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #8ab4f8; margin-bottom: 5px; }
        .main-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        
        #video-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 15px; 
            max-width: 800px; 
            flex: 1;
            background: #202124;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .video-box { position: relative; background: #1a1a1a; padding: 10px; border-radius: 10px; border: 1px solid #3c4043; }
        .video-box h4 { margin: 5px 0 10px 0; font-size: 15px; color: #ccff00; font-weight: bold; }
        video { width: 100%; height: 210px; background: black; border-radius: 8px; object-fit: cover; }
        
        .chat-box { background: #202124; padding: 20px; border-radius: 12px; width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #chat { height: 320px; overflow-y: auto; border: 1px solid #3c4043; background: #1a1a1a; padding: 10px; border-radius: 6px; text-align: left; margin-bottom: 10px; font-size: 14px; }
        #chat div { margin-bottom: 8px; line-height: 1.4; }
        input { padding: 10px; border-radius: 6px; border: none; width: 65%; color: black; }
        button { padding: 10px 15px; border-radius: 6px; border: none; background: #1a73e8; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #1557b0; }
        #room-input { width: 55%; margin-bottom: 10px; text-align: center; color: black; }
        .info-panel { background: #202124; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: inline-block; min-width: 400px; }
        
        .controls-container { margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .control-btn { background: #3c4043; padding: 10px 15px; font-size: 13px; color: white; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .control-btn:hover { background: #4f5357; }
        .control-btn.unmuted { background: #ea4335; }
        .control-btn.sharing { background: #34a853; }
        
        /* Chiqish tugmasi uchun alohida qizil dizayn */
        .leave-btn { background: #ea4335; }
        .leave-btn:hover { background: #c53026; }
    </style>
</head>
<body>

    <h1>Zoom Mini-Platforma</h1>
    <div id="welcome-user" style="color: #aaa; font-size: 16px; margin-bottom: 15px;"></div>

    <div class="info-panel">
        <div id="my-peer-id" style="font-weight: bold; font-size: 18px; color: #ccff00;">Xona yuklanmoqda...</div>
        <div style="margin-top: 10px;">
            <input type="text" id="room-input" placeholder="Suhbatdosh ID raqamini kiriting">
            <button onclick="connectToPeer()">Ulanish</button>
        </div>
        
        <div class="controls-container">
            <button id="mute-btn" class="control-btn" onclick="toggleMute()">🎙️ Mikrofon</button>
            <button id="camera-btn" class="control-btn" onclick="toggleCamera()">📹 Kamera</button>
            <button id="share-btn" class="control-btn" onclick="toggleScreenShare()">🖥️ Ekran</button>
            <button class="control-btn leave-btn" onclick="leaveRoom()">👋 Chiqish</button>
        </div>
    </div>

    <div class="main-container">
        <div id="video-grid"></div>

        <div class="chat-box">
            <h3>Jonli Chat</h3>
            <div id="chat"></div>
            <input type="text" id="messageInput" placeholder="Xabar yozing..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Yuborish</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
