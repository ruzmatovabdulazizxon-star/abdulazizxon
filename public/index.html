<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zoom Pro Platform</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js" defer></script>
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }
        #lobby {
            background: #1c1e21;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 100;
        }
        #lobby h2 { margin-bottom: 25px; font-size: 22px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: #a0a0a0; text-transform: uppercase; margin-bottom: 6px; }
        .input-group input { 
            width: 100%; padding: 14px; background: #2d3135; border: 1px solid #3e444a; 
            border-radius: 8px; color: white; outline: none; font-size: 15px; 
        }
        .input-group input:focus { border-color: #0e71eb; }
        #join-btn { 
            width: 100%; padding: 14px; background: #0e71eb; border: none; 
            border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; 
        }
        
        /* Video Oynasi va Konteyner Sozlamalari */
        #meet-container { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            height: 100dvh; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative; 
        }
        #upper-area { 
            flex: 1; 
            display: flex; 
            width: 100%; 
            height: calc(100% - 85px); 
            overflow: hidden; 
            position: relative; 
        }
        
        #video-grid { 
            flex: 1; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 10px; 
            padding: 12px; 
            background: #000; 
            overflow-y: auto; 
            align-content: center; 
            justify-content: center; 
            width: 100%; 
        }
        .video-box { 
            position: relative; 
            background: #1e1e1e; 
            border-radius: 8px; 
            overflow: hidden; 
            aspect-ratio: 16/9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .name-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0, 0, 0, 0.6); padding: 4px 10px; border-radius: 4px; font-size: 12px; z-index: 5; }
        
        /* Boshqaruv tugmalari paneli (Pastki qism - Mobil moslashuvchan) */
        #control-bar { 
            height: 85px; 
            background: #141414; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 14px; 
            border-top: 1px solid #232323; 
            width: 100%; 
            z-index: 20; 
            padding-bottom: env(safe-area-inset-bottom); /* iOS va yangi Androidlar uchun chekka joy */
        }
        .control-btn { background: #242424; border: none; width: 48px; height: 48px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: 0.2s; }
        .control-btn:hover { background: #3a3a3a; }
        .control-btn.active-off { background: #e74c3c !important; }
        .leave-btn { background: #e74c3c; border-radius: 6px; width: auto; padding: 0 16px; font-weight: bold; font-size: 14px; }
        
        /* Chat Sozlamalari */
        #chat-panel { width: 320px; background: #141414; border-left: 1px solid #232323; display: none; flex-direction: column; height: 100%; z-index: 30; }
        .chat-header { padding: 15px; border-bottom: 1px solid #232323; font-weight: 600; font-size: 15px; text-align: center; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #242424; padding: 8px 12px; border-radius: 8px; max-width: 90%; font-size: 13px; }
        .message b { color: #0e71eb; display: block; font-size: 11px; margin-bottom: 2px; }
        .chat-input-area { padding: 12px; display: flex; gap: 8px; border-top: 1px solid #232323; }
        #chat-input { flex: 1; padding: 10px; background: #242424; border: 1px solid #333; border-radius: 6px; color: white; outline: none; }
        #send-chat-btn { background: #0e71eb; border: none; color: white; padding: 0 14px; border-radius: 6px; cursor: pointer; }

        /* Modallar */
        .zoom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .zoom-modal { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px; width: 90%; max-width: 340px; text-align: center; }
        .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .modal-body { font-size: 13px; color: #ccc; margin-bottom: 15px; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-success { background: #0e72ed; color: white; }
        .btn-danger { background: #e02424; color: white; }
        .btn-secondary { background: #333; color: white; }

        /* MOBIL EKRANLAR UCHUN TUGMALARNI QALQIB CHIQARISH VA EKRANNI SOZLASH */
        @media (max-width: 768px) {
            #upper-area { flex-direction: column; height: calc(100% - 75px); }
            #video-grid { grid-template-columns: 1fr 1fr !important; grid-auto-rows: min-content; gap: 6px; padding: 6px; }
            .video-box { aspect-ratio: 1/1; }
            
            /* Tugmalarni to'liq ko'rinadigan qilib ko'tarish */
            #control-bar { 
                height: 75px; 
                gap: 10px; 
                padding: 0 10px;
                padding-bottom: calc(env(safe-area-inset-bottom) + 5px);
            }
            .control-btn { width: 44px; height: 44px; font-size: 15px; }
            .leave-btn { padding: 0 12px; font-size: 12px; height: 44px; }
            
            #chat-panel { 
                position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 75px); 
                z-index: 50; 
            }
        }
    </style>
</head>
<body>

    <div id="lobby">
        <h2>Zoom Platformasi</h2>
        <div class="input-group">
            <label>Ismingiz</label>
            <input type="text" id="username-input" placeholder="Ismingizni yozing..." autocomplete="off">
        </div>
        <div class="input-group">
            <label>Xona ID raqami</label>
            <input type="text" id="room-input" placeholder="Xona kodini yozing..." autocomplete="off">
        </div>
        <button id="join-btn">Uchrashuvga qo'shilish</button>
    </div>

    <div id="meet-container">
        <div id="upper-area">
            <div id="video-grid"></div>
            
            <div id="chat-panel">
                <div class="chat-header">Suhbat xonasi</div>
                <div id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Xabar yozing...">
                    <button id="send-chat-btn"><i class="fa fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div id="control-bar">
            <button class="control-btn" id="mic-btn"><i class="fa fa-microphone"></i></button>
            <button class="control-btn" id="cam-btn"><i class="fa fa-video"></i></button>
            <button class="control-btn" id="screen-btn"><i class="fa fa-desktop"></i></button>
            <button class="control-btn" id="chat-btn"><i class="fa fa-comment"></i></button>
            <button class="control-btn leave-btn" id="leave-btn"><i class="fa fa-sign-out-alt"></i> Chiqish</button>
        </div>
    </div>

    <div id="admin-modal" class="zoom-modal-overlay">
        <div class="zoom-modal">
            <h3 class="modal-title">Kirish so'rovi</h3>
            <p id="modal-message" class="modal-body"></p>
            <div class="modal-actions">
                <button id="btn-reject" class="modal-btn btn-danger">Rad etish</button>
                <button id="btn-accept" class="modal-btn btn-success">Ruxsat berish</button>
            </div>
        </div>
    </div>

    <div id="guest-modal" class="zoom-modal-overlay">
        <div class="zoom-modal">
            <h3 id="guest-modal-title" class="modal-title">Kutish zali</h3>
            <p id="guest-modal-message" class="modal-body">Admin tasdiqlashi kutilmoqda...</p>
            <div class="modal-actions">
                <button id="btn-guest-close" class="modal-btn btn-secondary" style="display: none;">Yopish</button>
            </div>
        </div>
    </div>

</body>
</html>
