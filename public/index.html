<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Professional Platforma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0f11;
            --panel-bg: rgba(26, 26, 30, 0.9);
            --border-color: #2a2a30;
            --text-color: #f5f5f7;
            --accent-green: #24d85f;
            --danger-red: #e02d3c;
            --btn-hover: #2e2e38;
            --chat-bg: #19191d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Yuqori ma'lumotlar paneli */
        .header-bar {
            height: 50px;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
        }

        .header-left, .header-right {
            pointer-events: auto;
        }

        .room-info {
            font-size: 14px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .room-id-badge {
            color: var(--accent-green);
            font-weight: bold;
        }

        /* Asosiy ishchi maydon (Videolar va Chat) */
        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            height: calc(100vh - 80px);
            margin-top: 20px;
        }

        /* Dinamik Video Grid (Zoom Gallery ko'rinishi) */
        .video-grid-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        #video-grid {
            display: grid;
            gap: 12px;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 800px;
            justify-content: center;
            align-content: center;
        }

        /* Video Box (Har bir foydalanuvchi) */
        .video-box {
            position: relative;
            background-color: #1e1e24;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
            width: 100%;
            height: 100%;
        }

        /* Aktiv gapirayotgan foydalanuvchini ajratish */
        .video-box.active-speaker {
            border-color: var(--accent-green);
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* O'zini ko'rishni oyna effekti qilish */
        }

        /* Foydalanuvchi ismi va holati */
        .video-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        .status-icon {
            font-size: 11px;
        }

        .status-icon.muted {
            color: var(--danger-red);
        }

        /* O'ng tomondan chiquvchi Chat paneli */
        .chat-sidebar {
            width: 320px;
            background-color: var(--chat-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 5;
        }

        .chat-sidebar.closed {
            width: 0;
            margin-right: -320px;
            border-left: none;
        }

        .chat-header {
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-chat-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 16px;
            opacity: 0.7;
        }

        .close-chat-btn:hover {
            opacity: 1;
        }

        #chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-msg {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 90%;
            align-self: flex-start;
            font-size: 13px;
            line-height: 1.4;
        }

        .chat-msg.me {
            background: rgba(36, 216, 95, 0.15);
            border-left: 3px solid var(--accent-green);
            align-self: flex-end;
        }

        .msg-meta {
            font-size: 10px;
            opacity: 0.6;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .chat-input-area {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background-color: #2a2a30;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 16px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-green);
        }

        .send-btn {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        /* Pastki Zoom boshqaruv paneli (Control Bar) */
        .control-bar {
            height: 80px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            min-width: 68px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background-color: var(--btn-hover);
        }

        .control-btn i {
            font-size: 18px;
        }

        .control-btn span {
            font-size: 10px;
            font-weight: 500;
        }

        /* OFF holatidagi tugma rangi */
        .control-btn.off i {
            color: var(--danger-red);
        }

        .leave-btn {
            background-color: var(--danger-red);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .leave-btn:hover {
            opacity: 0.9;
        }

        /* Ruxsat kutish va ulanish paneli */
        .join-panel-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #0b0b0d;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .join-card {
            background-color: #16161a;
            border: 1px solid var(--border-color);
            padding: 32px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .join-card h2 {
            font-size: 20px;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            background-color: #232329;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-green);
        }

        .join-btn {
            width: 100%;
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .join-btn:hover {
            opacity: 0.95;
        }

        /* Kutish holati ekrani */
        .waiting-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 150;
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--accent-green);
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Lobby modal oynasi (Admin uchun) */
        .lobby-modal {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e24;
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            padding: 16px 24px;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            gap: 20px;
        }

        .lobby-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-admit { background-color: var(--accent-green); color: #000; }
        .btn-reject { background-color: var(--danger-red); color: #fff; }

        /* RESPONSIVE MOSLASHUVCHANLIK (Media Queries) */
        @media (max-width: 768px) {
            .control-bar {
                padding: 0 12px;
                height: 70px;
            }
            .control-btn {
                min-width: 50px;
                padding: 4px;
            }
            .control-btn span {
                display: none; /* Mobil telefonda faqat ikonkalar qoladi */
            }
            .chat-sidebar {
                position: absolute;
                right: 0;
                top: 0;
                bottom: 0;
                height: 100%;
                width: 280px;
                box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            }
            .chat-sidebar.closed {
                margin-right: -280px;
            }
            .header-bar {
                padding: 0 12px;
            }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="header-left">
            <div class="room-info">Xona: <span class="room-id-badge" id="room-display">Kutilmoqda...</span></div>
        </div>
        <div class="header-right">
            </div>
    </div>

    <div id="join-panel" class="join-panel-container">
        <div class="join-card">
            <h2>Zoom Mini-Platformasiga kirish</h2>
            <div class="form-group">
                <label>Ismingiz</label>
                <input type="text" id="username-input" placeholder="Ismingizni kiriting" required>
            </div>
            <div class="form-group">
                <label>Ulanish xona ID raqami (ixtiyoriy)</label>
                <input type="text" id="target-room-input" placeholder="Suhbatdosh ID raqamini kiriting">
            </div>
            <button class="join-btn" onclick="startMeeting()">Uchrashuvni boshlash</button>
        </div>
    </div>

    <div class="main-container">
        <div class="video-grid-wrapper">
            <div id="video-grid"></div>
        </div>

        <div class="chat-sidebar closed" id="chat-sidebar">
            <div class="chat-header">
                <span>Jonli Chat</span>
                <button class="close-chat-btn" onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Xabar yozing..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div class="control-bar">
        <div class="control-group">
            <button class="control-btn" id="mute-btn" onclick="toggleMute()">
                <i class="fa-solid fa-microphone"></i>
                <span>Ovozni o'chirish</span>
            </button>
            <button class="control-btn" id="camera-btn" onclick="toggleCamera()">
                <i class="fa-solid fa-video"></i>
                <span>Kamerani o'chirish</span>
            </button>
        </div>

        <div class="control-group">
            <button class="control-btn" id="share-btn" onclick="toggleScreenShare()">
                <i class="fa-solid fa-desktop"></i>
                <span>Ekran ulashish</span>
            </button>
            <button class="control-btn" onclick="toggleChat()">
                <i class="fa-solid fa-comment"></i>
                <span>Chat</span>
            </button>
        </div>

        <div class="control-group">
            <button class="leave-btn" onclick="leaveRoom()">Chiqish</button>
        </div>
    </div>

    <div class="waiting-overlay" id="waiting-screen">
        <div class="spinner"></div>
        <p id="waiting-text" style="font-size: 14px; font-weight: 500;">Xona egasidan ruxsat kutilmoqda...</p>
    </div>

    <div class="lobby-modal" id="lobby-modal">
        <span id="lobby-msg" style="font-size: 13px;">"Foydalanuvchi" xonaga kirish ruxsatini so'rayapti.</span>
        <div class="lobby-buttons">
            <button class="btn-sm btn-admit" id="btn-admit">Ruxsat berish</button>
            <button class="btn-sm btn-reject" id="btn-reject">Rad etish</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
