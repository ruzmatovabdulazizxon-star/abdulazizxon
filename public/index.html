<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Professional Video Meeting</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js" defer></script>
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Umumiy Sozlamalar */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body {
            background-color: #0f1011;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 1. Kirish (Lobby) Oynasi */
        #lobby {
            background: #1c1e21;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 10;
        }
        #lobby h2 { 
            margin-bottom: 25px; 
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }
        .input-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        .input-group label { 
            display: block; 
            font-size: 11px; 
            color: #a0a0a0; 
            text-transform: uppercase; 
            margin-bottom: 6px; 
            letter-spacing: 0.5px;
        }
        .input-group input { 
            width: 100%; 
            padding: 14px; 
            background: #2d3135; 
            border: 1px solid #3e444a; 
            border-radius: 8px; 
            color: white; 
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #0e71eb; /* Zoom ko'k rangi */
        }
        #join-btn { 
            width: 100%; 
            padding: 14px; 
            background: #0e71eb; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer; 
            transition: background 0.2s;
        }
        #join-btn:hover {
            background: #0b5cbe;
        }

        /* 2. Kutish Xonasi (Waiting Room) */
        #waiting-screen {
            display: none;
            text-align: center;
            background: #1c1e21;
            padding: 40px 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #waiting-screen h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .spinner {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #0e71eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 3. Asosiy Video Zona (Desktop formatda) */
        #meet-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
            position: relative;
        }

        #main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
        }

        /* Dinamik Video Grid */
        #video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #141517;
            overflow-y: auto;
            align-content: center;
            justify-content: center;
        }
