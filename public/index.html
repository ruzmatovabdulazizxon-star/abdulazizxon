<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Mini-Platforma (Guruhli Tizim)</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #141414;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #8ab4f8; margin-bottom: 10px; }
        
        #room-header {
            background: #202124;
            padding: 15px 30px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Video paneli - hamma kelgan foydalanuvchilar grid ichiga joylashadi */
        #video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: 240px;
            background: #222;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #3c4043;
            transform: scaleX(-1); /* O'zimizni ko'zgudagidek ko'rish uchun */
        }

        /* Qisqa kod orqali boshqa xonaga o'tish bo'limi */
        #join-box {
            margin: 15px 0;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            outline: none;
            width: 200px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            background: #1a73e8;
            color: white;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover { background: #1557b0; }

        /* Umumiy guruh chati */
        #chat-container {
            width: 100%;
            max-width: 450px;
            background: #202124;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #chat {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #3c4043;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            text-align: left;
        }
        #chat-form {
            display: flex;
        }
        #chat-form input { flex: 1; text-align: left; }
    </style>
</head>
<body>

    <h1>Zoom Mini-Platforma</h1>

    <div id="room-header">
        <div id="my-peer-id">Xona yuklanmoqda...</div>
    </div>

    <div id="join-box">
        <input type="text" id="room-input" placeholder="Xona kodini kiriting...">
        <button onclick="connectToPeer()">Xonaga o'tish</button>
    </div>

    <div id="video-grid">
        <div>
            <h3 style="text-align:center; margin: 5px;">Siz (Kamera)</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <div id="chat-container">
        <h3 style="margin-top:0;">Guruh Chati</h3>
        <div id="chat"></div>
        <div id="chat-form">
            <input type="text" id="messageInput" placeholder="Xabar yozing...">
            <button onclick="sendMessage()">Yuborish</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
