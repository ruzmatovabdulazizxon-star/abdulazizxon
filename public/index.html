<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Platformasi</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; display: flex; height: 100vh; flex-direction: column; align-items: center; justify-content: center; }
    #join-card { background: #2a2a2a; padding: 30px; border-radius: 12px; display: flex; flex-direction: column; gap: 15px; width: 320px; text-align: center; }
    input, button { padding: 12px; border-radius: 6px; border: none; font-size: 16px; }
    input { background: #3a3a3a; color: white; }
    button { background: #0e71eb; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0b5ed7; }
    #room { display: none; flex-direction: column; width: 100%; height: 100%; }
    #video-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; padding: 20px; align-items: center; justify-items: center; }
    video { width: 100%; height: 100%; max-height: 80vh; object-fit: cover; background: black; border-radius: 8px; }
    #controls { height: 70px; background: #242424; display: flex; align-items: center; justify-content: center; gap: 15px; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #bb2d3b; }
  </style>
</head>
<body>

  <div id="join-card">
    <h2>Xonaga Kirish</h2>
    <input type="text" id="username" placeholder="Ismingiz" value="Ishtirokchi">
    <input type="text" id="room-name" placeholder="Xona nomi" value="asosiy-xona">
    <button onclick="joinRoom()">Ulanish</button>
  </div>

  <div id="room">
    <div id="video-grid"></div>
    <div id="controls">
      <button onclick="toggleAudio()">Mute/Unmute Mic</button>
      <button onclick="toggleVideo()">Camera On/Off</button>
      <button onclick="shareScreen()">Screen Share</button>
      <button class="btn-danger" onclick="leaveRoom()">Chiqish</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
