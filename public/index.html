<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Professional Platforma</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js" defer></script>
    <script src="/socket.io/socket.io.js" defer></script>
    <script>
        // Backend'dan kelgan Room ID'ni global o'zgaruvchiga olamiz
        const ROOM_ID = "<%= roomId %>";
    </script>
    <script src="app.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f1011;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* Kirish oynasi (Lobby) */
        #lobby {
            background: #1c1e21;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            z-index: 10;
        }
        #lobby h2 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #f1f1f1;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            color: #a0a0a0;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #2d3135;
            border: 1px solid #3e444a;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #2ecc71;
        }
        #join-btn {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #join-btn:hover {
            background: #27ae60;
        }

        /* Video uchrashuv zonasi (Dastlab yashirin bo'ladi) */
        #meet-container {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
        }
        #video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #0f1011;
            overflow-y: auto;
        }
        .video-box {
            position: relative;
            background: #232427;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Oyna effekti */
        }
        .name-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="lobby">
        <h2>Zoom Mini-Platformasiga kirish</h2>
        <div class="input-group">
            <label>Ismingiz</label>
            <input type="text" id="username-input" placeholder="Ismingizni kiriting..." autocomplete="off">
        </div>
        <div class="input-group">
            <label>Ulanish xona ID raqami (Ixtiyoriy)</label>
            <input type="text" id="room-input" placeholder="Suhbatdosh ID raqamini kiriting...">
        </div>
        <button id="join-btn">Uchrashuvni boshlash</button>
    </div>

    <div id="meet-container">
        <div id="video-grid"></div>
    </div>

</body>
</html>
