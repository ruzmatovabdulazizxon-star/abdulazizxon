<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Professional Video Meeting</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js" defer></script>
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f1011;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #lobby {
            background: #1c1e21;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        #lobby h2 { margin-bottom: 25px; font-size: 22px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: #a0a0a0; text-transform: uppercase; margin-bottom: 6px; }
        .input-group input { 
            width: 100%; padding: 14px; background: #2d3135; border: 1px solid #3e444a; 
            border-radius: 8px; color: white; outline: none; font-size: 15px; 
        }
        .input-group input:focus { border-color: #0e71eb; }
        #join-btn { 
            width: 100%; padding: 14px; background: #0e71eb; border: none; 
            border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; 
        }
        #join-btn:hover { background: #0b5cbe; }
        
        #meet-container { display: none; width: 100vw; height: 100vh; flex-direction: row; }
        #main-area { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
        #video-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; padding: 20px; background: #141517; overflow-y: auto; align-content: center; justify-content: center; }
        .video-box { position: relative; background: #232427; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .name-label { position: absolute; bottom: 12px; left: 12px; background: rgba(0, 0, 0, 0.65); padding: 5px 12px; border-radius: 6px; font-size: 13px; }
        
        #control-bar { height: 85px; background: #1c1e21; display: flex; justify-content: center; align-items: center; gap: 15px; border-top: 1px solid #2d3135; }
        .control-btn { background: #2d3135; border: none; width: 52px; height: 52px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .control-btn:hover { background: #3e444a; }
        .leave-btn { background: #e74c3c; border-radius: 8px; width: auto; padding: 0 22px; font-weight: bold; font-size: 15px; }
        
        #chat-panel { width: 350px; background: #1c1e21; border-left: 1px solid #2d3135; display: none; flex-direction: column; height: 100%; }
        .chat-header { padding: 20px; border-bottom: 1px solid #2d3135; font-weight: 600; }
        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { background: #2d3135; padding: 10px 14px; border-radius: 8px; max-width: 85%; font-size: 14px; }
        .chat-input-area { padding: 20px; display: flex; gap: 10px; border-top: 1px solid #2d3135; }
        #chat-input { flex: 1; padding: 12px; background: #2d3135; border: none; border-radius: 8px; color: white; outline: none; }
        #send-chat-btn { background: #0e71eb; border: none; color: white; padding: 0 16px; border-radius: 8px; cursor: pointer; }

        @media (max-width: 768px) {
            #meet-container { flex-direction: column; }
            #video-grid { grid-template-columns: 1fr !important; padding: 10px; }
            .video-box { aspect-ratio: 4/3; max-height: 35vh; }
            #control-bar { height: 75px; gap: 10px; }
            .control-btn { width: 44px; height: 44px; font-size: 15px; }
            #chat-panel { width: 100%; height: 40vh; border-left: none; border-top: 1px solid #2d3135; }
        }
    </style>
</head>
<body>

    <div id="lobby">
        <h2>Zoom Uchrashuv</h2>
        <div class="input-group">
            <label>Ismingiz</label>
            <input type="text" id="username-input" placeholder="Ismingizni kiriting..." autocomplete="off">
        </div>
        <div class="input-group">
            <label>Xona ID raqami</label>
            <input type="text" id="room-input" placeholder="Xona nomini yozing..." autocomplete="off">
        </div>
        <button id="join-btn">Uchrashuvga qo'shilish</button>
    </div>

    <div id="meet-container">
        <div id="main-area">
            <div id="video-grid"></div>
            <div id="control-bar">
                <button class="control-btn" id="mic-btn"><i class="fa fa-microphone"></i></button>
                <button class="control-btn" id="cam-btn"><i class="fa fa-video"></i></button>
                <button class="control-btn" id="chat-btn"><i class="fa fa-comment"></i></button>
                <button class="control-btn leave-btn" id="leave-btn"><i class="fa fa-sign-out-alt"></i> Chiqish</button>
            </div>
        </div>

        <div id="chat-panel">
            <div class="chat-header">Xona Chati</div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Xabar yozing...">
                <button id="send-chat-btn"><i class="fa fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

</body>
</html>
