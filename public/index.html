<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Mini-Platforma Pro</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #141414; color: white; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #8ab4f8; margin-bottom: 5px; font-size: 24px; }
        #welcome-user { color: #aaa; font-size: 15px; margin-bottom: 15px; }
        
        .main-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        
        #video-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 15px; 
            max-width: 850px; 
            flex: 1;
            background: #202124;
            padding: 20px;
            border-radius: 12px;
            min-height: 400px;
        }
        .video-box { position: relative; background: #1a1a1a; padding: 8px; border-radius: 10px; border: 1px solid #3c4043; }
        .video-box h4 { margin: 5px 0; font-size: 14px; color: #ccff00; }
        video { width: 100%; height: 200px; background: black; border-radius: 8px; object-fit: cover; }
        
        .chat-box { background: #202124; padding: 20px; border-radius: 12px; width: 300px; }
        #chat { height: 340px; overflow-y: auto; border: 1px solid #3c4043; background: #1a1a1a; padding: 10px; border-radius: 6px; text-align: left; font-size: 14px; }
        #chat div { margin-bottom: 8px; }
        
        .control-panel { background: #202124; padding: 15px; border-radius: 12px; display: inline-block; min-width: 450px; margin-bottom: 15px; }
        .room-title { font-size: 18px; color: #ccff00; font-weight: bold; margin-bottom: 12px; }
        
        .btn-group { display: flex; justify-content: center; gap: 10px; }
        button { padding: 10px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .action-btn { background: #3c4043; color: white; }
        .action-btn:hover { background: #4f5357; }
        .action-btn.off { background: #ea4335; }
        .leave-btn { background: #ea4335; color: white; }
        .leave-btn:hover { background: #c53026; }
        
        .chat-input-group { display: flex; gap: 5px; margin-top: 10px; }
        .chat-input-group input { flex: 1; padding: 10px; border-radius: 6px; border: none; }
        .chat-input-group button { background: #1a73e8; color: white; }
    </style>
</head>
<body>

    <h1>Zoom Mini-Platforma</h1>
    <div id="welcome-user">Yuklanmoqda...</div>

    <div class="control-panel">
        <div class="room-title" id="room-display">Xona: Yuklanmoqda...</div>
        
        <div class="btn-group">
            <button id="mute-btn" class="action-btn" onclick="toggleMute()">🎙️ Mikrofon</button>
            <button id="camera-btn" class="action-btn" onclick="toggleCamera()">📹 Kamera</button>
            <button id="share-btn" class="action-btn" onclick="toggleScreenShare()">🖥️ Ekran ulashish</button>
            <button class="leave-btn" onclick="leaveRoom()">👋 Chiqish</button>
        </div>
    </div>

    <div class="main-container">
        <div id="video-grid"></div>

        <div class="chat-box">
            <h3>Jonli Chat</h3>
            <div id="chat"></div>
            <div class="chat-input-group">
                <input type="text" id="messageInput" placeholder="Xabar yozing..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">>></button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
