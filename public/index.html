<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Pro Platform</title>
    <!-- Tailwind CSS chiroyli dizayn uchun -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io kutubxonasi (CDN orqali ishonchli ulanish) -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <!-- LiveKit mijoz kutubxonasi -->
    <script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        body {
            background-color: #0d0e12;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center overflow-hidden">

    <!-- Kirish oynasi (Lobby) -->
    <div id="lobby" class="bg-[#1a1c23] p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-800">
        <h2 class="text-2xl font-bold mb-6 text-center text-white">Uchrashuvga qo'shilish</h2>
        <div class="space-y-4">
            <div>
                <input type="text" id="username" placeholder="Ismingizni kiriting..." class="w-full px-4 py-3 bg-[#242731] border border-gray-700 rounded-lg text-white focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div>
                <input type="text" id="room-id" placeholder="Xona ID (masalan: room123)" class="w-full px-4 py-3 bg-[#242731] border border-gray-700 rounded-lg text-white focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div>
                <select id="role" class="w-full px-4 py-3 bg-[#242731] border border-gray-700 rounded-lg text-white focus:outline-none focus:border-blue-500 transition-colors">
                    <option value="guest">Mehmon (Guest)</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button id="join-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors focus:outline-none">
                Kirish
            </button>
        </div>
    </div>

    <!-- Video uchrashuv maydoni -->
    <div id="meet-container" class="hidden w-full h-screen flex flex-col p-4">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold">Xona: <span id="active-room-title" class="text-blue-400">-</span></h1>
            <button id="leave-btn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-bold transition-colors">Chiqish</button>
        </div>
        <div id="video-grid" class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 items-center justify-center bg-[#16181f] rounded-xl p-4 overflow-y-auto">
            <!-- Videolar shu yerga tushadi -->
        </div>
    </div>

    <!-- Admin uchun: Ruxsat so'rash oynasi (Modal) -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-black/70 flex justify-center items-center z-50">
        <div class="bg-[#1a1c23] p-6 rounded-xl border border-gray-800 max-w-sm w-full text-center">
            <h3 class="text-lg font-bold mb-4 text-white"><span id="requesting-user" class="text-blue-400">Kimdir</span> xonaga kirmoqchi</h3>
            <div class="flex justify-center space-x-4">
                <button id="accept-btn" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-2 rounded-lg font-bold transition-colors">Ruxsat berish</button>
                <button id="reject-btn" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold transition-colors">Rad etish</button>
            </div>
        </div>
    </div>

    <!-- Mehmon uchun: Kutish oynasi (Modal) -->
    <div id="guest-modal" class="hidden fixed inset-0 bg-black/80 flex justify-center items-center z-50">
        <div class="bg-[#1a1c23] p-8 rounded-xl border border-gray-800 text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <h3 class="text-lg font-bold text-white">Iltimos, kuting...</h3>
            <p class="text-gray-400 mt-2">Admin sizni xonaga kiritishini kutmoqdasiz.</p>
        </div>
    </div>

    <!-- Frontend mantiqiy kodi -->
    <script src="app.js"></script>
</body>
</html>
